<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  .content-factory-app {
    --ink: #14171a; --surface: #1c2024; --surface-2: #23282d; --line: #2f353b;
    --paper: #edece6; --muted: #8b9096; --amber: #f0a202; --teal: #3fa796; --red: #d95d5d;
  }
  .content-factory-app.home-integrated {
    --ink:#faf8f4; --surface:#fff; --surface-2:#f4f1fb; --line:#e8e3ee;
    --paper:#221f2b; --muted:#7a7488; --amber:#b8925a; --teal:#3fa796; --red:#c84d4d;
  }
  @scope (.content-factory-app) {
  * { box-sizing: border-box; }
  :scope { display:block; background: var(--ink); color: var(--paper); font-family: 'Inter', sans-serif; margin: 0; padding: 20px 16px 60px; border-radius:18px; }
  :scope.home-integrated { padding:18px 18px 28px; border-radius:0; }
  :scope.home-integrated > .eyebrow,
  :scope.home-integrated > h1,
  :scope.home-integrated > .sub { display:none; }
  :scope.home-integrated .stepper-meta { margin-top:4px; }
  :scope.home-integrated .chip-circle { background:#fff; }
  :scope.home-integrated .chip-label { color:#655f70; }
  :scope.home-integrated .chip.active .chip-label,
  :scope.home-integrated .chip.done .chip-label { color:#287d70; }
  :scope.home-integrated .panel { box-shadow:0 10px 26px rgba(75,63,114,.07); }
  :scope.home-integrated .btn-primary { color:#fff; background:#4b3f72; }
  :scope.home-integrated .btn-primary:disabled { background:#ebe7ef; color:#a7a0af; }
  :scope.home-integrated .cost-box { background:#fdf9f2; }
  .eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--amber); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
  h1 { font-family: 'Oswald', sans-serif; font-size: 26px; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 680px; line-height: 1.5; }
  .save-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px;
    max-width: 680px; color: var(--muted); font-size: 11px; }
  .save-status { display: inline-flex; align-items: center; gap: 6px; }
  .save-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .reset-btn { border: 0; background: none; color: var(--muted); padding: 0; font-size: 11px; cursor: pointer; text-decoration: underline; }

  .stepper-wrap { position: relative; margin-top: 26px; overflow-x: auto; padding-bottom: 6px; }
  .stepper-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
  .step-progress { color: var(--amber); }
  .swipe-hint { display: none; }
  .stepper { display: flex; min-width: 640px; position: relative; }
  .stepper::before { content: ""; position: absolute; top: 17px; left: 24px; right: 24px; height: 1px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 16px); }
  .chip { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; padding: 0 4px; position: relative; z-index: 1; }
  .chip-circle { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; border: 1.5px solid var(--line); background: var(--ink); color: var(--muted); }
  .chip-label { font-size: 11px; margin-top: 8px; color: var(--muted); text-align: center; max-width: 78px; line-height: 1.3; }
  .chip.active .chip-circle { border-color: var(--amber); color: var(--amber); background: rgba(240,162,2,.1); }
  .chip.active .chip-label { color: var(--paper); font-weight: 600; }
  .chip.done .chip-circle { border-color: var(--teal); color: var(--teal); background: rgba(63,167,150,.1); }
  .chip.done .chip-label { color: var(--teal); }

  .panel { display: none; margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .panel.show { display: block; }
  .station { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--amber); letter-spacing: .12em; }
  .panel-title { font-family: 'Oswald', sans-serif; font-size: 20px; margin-top: 2px; }
  .panel-desc { color: var(--muted); font-size: 13px; margin-top: 4px; }
  label.field { font-size: 12px; color: var(--muted); margin: 14px 0 6px; display: block; }
  input, textarea, select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--paper); padding: 10px 12px; font-size: 13.5px; font-family: 'Inter', sans-serif; }
  input[type=range] { padding: 0; }
  input[type=checkbox] { width: auto; }
  input[type=file] { padding: 8px; font-size: 12.5px; }
  textarea { min-height: 110px; line-height: 1.55; }
  textarea.output { min-height: 160px; }
  textarea.small { min-height: 54px; font-size: 12px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .trend-chip { font-size: 12px; font-family: 'JetBrains Mono', monospace; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
  .trend-chip.on { border-color: var(--amber); color: var(--paper); background: rgba(240,162,2,.1); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .toolbar-row { margin-top: 10px; }
  .btn-primary { background: var(--amber); color: #1c1400; border: none; border-radius: 8px; padding: 10px 16px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn-primary:disabled { opacity: 1; cursor: not-allowed; background: #343a40; color: #737a80; }
  .btn-ghost { background: none; color: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 12.5px; cursor: pointer; }
  .btn-ghost.small { padding: 5px 8px; font-size: 11.5px; }
  .btn-ghost.on { border-color: var(--teal); color: var(--teal); background: rgba(63,167,150,.1); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: var(--red); font-size: 12.5px; margin-top: 8px; }
  .stamp { display: inline-flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--teal); border: 1px solid var(--teal); border-radius: 999px; padding: 3px 9px; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 10px; border-left: 2px solid var(--line); padding-left: 10px; }
  .note.cost { border-left-color: var(--amber); color: var(--amber); }
  .cost-box { border: 1px solid rgba(240,162,2,.42); background: rgba(240,162,2,.07); border-radius: 9px;
    padding: 11px 12px; margin-top: 12px; color: var(--amber); font-size: 11.5px; line-height: 1.55; }
  .cost-box strong { color: var(--paper); }
  .generation-status { display: inline-flex; align-items: center; gap: 7px; color: var(--amber); font-size: 11.5px; }
  .generation-status::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--amber);
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
  .img-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); padding-bottom: 10px; }
  .img-card.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(63,167,150,.2); }
  .img-swatch { height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .img-swatch img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-swatch .placeholder-label { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .img-card-body { padding: 8px 10px 0; font-size: 10.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .img-card-actions { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }
  .nav-footer { display: flex; justify-content: space-between; margin-top: 24px; }
  .check-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .check-item { font-size: 13px; }
  .check-item.on { color: var(--teal); } .check-item.off { color: var(--muted); }
  @media (max-width: 640px) {
    body { padding-left: 16px; padding-right: 16px; }
    .grid2 { grid-template-columns: 1fr; }
    .panel { padding: 22px; }
    .stepper-wrap { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; scroll-snap-type: x proximity; }
    .chip { scroll-snap-align: center; }
    .swipe-hint { display: inline; }
    .nav-footer { gap: 10px; }
    .nav-footer button { min-width: 108px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } .generation-status::before { animation: none; } }
  :scope.embedded { padding: 18px 16px 40px; }
  :scope.embedded .eyebrow { margin-top: 0; }
  :scope.embedded h1 { font-size: 23px; }
  :scope.embedded .sub { max-width: 760px; }
  }
</style>

<div class="content-factory-app{% if factory_home_mode|default(false) %} home-integrated{% endif %}">

<div class="eyebrow">MI CREATOR OS — 콘텐츠 조립 라인</div>
<h1>키워드 하나로 7단계 콘텐츠 뽑기</h1>
<div class="sub">키워드 하나를 입력하면 블로그 글부터 이미지·영상·발행 페이지까지 단계별로 만들어드립니다.</div>
<div class="save-bar">
  <span class="save-status" id="save-status">이 브라우저에 자동 저장됩니다</span>
  <button class="reset-btn" type="button" onclick="resetFactory()">새 작업 시작</button>
</div>

<div class="stepper-meta"><span class="step-progress" id="step-progress">STEP 1 / 7</span><span class="swipe-hint">← 좌우로 밀어 단계 보기 →</span></div>
<div class="stepper-wrap">
  <div class="stepper" id="stepper"></div>
</div>

<div id="panels"></div>

<script>
const STEPS = [
  {n:1, key:'original', label:'애드센스 원본 글', desc:'키워드 하나로 SEO 원고 초안을 뽑습니다.'},
  {n:2, key:'naver', label:'네이버 글', desc:'원본을 네이버 블로그 톤으로 다시 짭니다.'},
  {n:3, key:'thread', label:'스레드 글', desc:'짧고 훅 있는 스레드용 버전으로 압축합니다.'},
  {n:4, key:'shorts', label:'쇼츠 기획', desc:'장면별 대본과 화면 지시를 만듭니다.'},
  {n:5, key:'image', label:'이미지', desc:'장면별로 나노바나나 이미지를 직접 생성합니다.'},
  {n:6, key:'video', label:'숏폼 영상', desc:'고른 이미지·대본·음성을 한 벌로 묶습니다.'},
  {n:7, key:'publish', label:'발행 페이지', desc:'전체 결과물을 검수하고 마감 도장을 찍습니다.'},
];
const TRENDS = ['비트코인 시세','전기요금 누진세','연말정산 미리보기','실업급여 조건','건강보험료 조정'];
const VOICES = ['차분한 여성 (기본)','밝은 여성','차분한 남성','신뢰감 있는 남성'];
const IMAGE_CARD_COUNT = 8;

const HOME_INTEGRATED = document.querySelector('.content-factory-app')?.classList.contains('home-integrated');
const STORAGE_KEY = HOME_INTEGRATED ? 'mi-content-factory-home-v1' : 'mi-content-factory-v1';

function friendlyError(message, image=false) {
  const text = String(message || '');
  if (/429|RESOURCE_EXHAUSTED|quota/i.test(text)) {
    return image
      ? '이미지 생성 한도를 모두 사용했습니다. Google AI 결제·할당량을 확인한 뒤 다시 시도해 주세요.'
      : 'AI 사용 한도를 모두 사용했습니다. 잠시 후 다시 시도하거나 API 결제·할당량을 확인해 주세요.';
  }
  if (/Failed to fetch|NetworkError|fetch/i.test(text)) {
    return '서버에 연결하지 못했습니다. 잠시 후 같은 버튼을 다시 눌러 주세요.';
  }
  return text.length > 180 ? '요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.' : text;
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && saved.content && saved.done) {
      return { active: Number(saved.active) || 1, content: saved.content, done: saved.done,
        meta: saved.meta || { imageGenerations: 0 } };
    }
  } catch (_) {}
  return { active: 1, content: {}, done: {}, meta: { imageGenerations: 0 } };
}

const state = loadState();
const incomingKeyword = new URLSearchParams(window.location.search).get('keyword');
const isEmbedded = new URLSearchParams(window.location.search).get('embed') === '1';
if (isEmbedded) document.querySelector('.content-factory-app')?.classList.add('embedded');
if (incomingKeyword) {
  state.active = 1;
  state.content.keyword = incomingKeyword.trim();
}

function persistState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const el = document.getElementById('save-status');
    if (el) el.textContent = `자동 저장됨 · ${new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}`;
  } catch (_) {}
}

setInterval(persistState, 1500);

function resetFactory() {
  if (!confirm('현재 작업 내용을 지우고 새로 시작할까요?')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdToHtml(md) {
  let html = esc(md || '');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  return html.split(/\n\n+/).map(p => p.trim().startsWith('<h') ? p : ('<p>' + p.replace(/\n/g,'<br>') + '</p>')).join('\n');
}

async function callApi(step, payload) {
  const res = await fetch('/content-factory/api/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ step, ...payload })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '오류가 발생했습니다.');
  return data.result;
}

async function callImageApi(prompt) {
  const res = await fetch('/content-factory/api/generate-image', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ prompt })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '이미지 생성 중 오류가 발생했습니다.');
  return data.url;
}

function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map(s => `
    <button class="chip ${state.active===s.n?'active':''} ${state.done[s.key]?'done':''}" onclick="goTo(${s.n})">
      <div class="chip-circle">${state.done[s.key] ? '✓' : String(s.n).padStart(2,'0')}</div>
      <div class="chip-label">${s.label}</div>
    </button>`).join('');
  const progress = document.getElementById('step-progress');
  if (progress) progress.textContent = `STEP ${state.active} / ${STEPS.length} · ${Math.round(state.active / STEPS.length * 100)}%`;
  requestAnimationFrame(() => {
    const active = el.querySelector('.chip.active');
    if (active && window.innerWidth <= 640) active.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  });
}

function goTo(n) { state.active = n; render(); }

function flashBtn(btn, text) {
  if (!btn) return;
  const old = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { if (btn) btn.textContent = old; }, 1200);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text || '');
  flashBtn(btn, '복사됨');
}

function copyHtml(fieldKey, btn) {
  navigator.clipboard.writeText(mdToHtml(state.content[fieldKey] || ''));
  flashBtn(btn, '복사됨');
}

function focusEdit(taId) {
  const el = document.getElementById(taId);
  if (el) { el.focus(); el.scrollIntoView({behavior:'smooth', block:'center'}); }
}

function toolbarHTML(fieldKey, taId, regenerateCall) {
  return `<div class="row toolbar-row">
    <button class="btn-ghost" onclick="copyText(state.content['${fieldKey}'], this)">📋 서식·이미지 복사</button>
    <button class="btn-ghost" onclick="copyHtml('${fieldKey}', this)">&lt;/&gt; HTML 코드 복사</button>
    <button class="btn-ghost" onclick="copyText(state.content['${fieldKey}'], this)">▤ 마크다운 복사</button>
    <button class="btn-ghost" onclick="focusEdit('${taId}')">✏️ 직접 수정</button>
    <button class="btn-ghost" onclick="${regenerateCall}">↻ 다시 생성</button>
  </div>`;
}

async function runStep(key, field, payload, btn) {
  let oldText = '';
  if (btn) { oldText = btn.textContent; btn.disabled = true; btn.textContent = '생성 중…'; }
  const errBox = document.getElementById('err-' + key);
  if (errBox) errBox.textContent = '';
  const statusBox = document.getElementById('status-' + key);
  if (statusBox) statusBox.innerHTML = '<span class="generation-status">AI가 결과를 만들고 있습니다. 입력 내용은 그대로 보존됩니다.</span>';
  try {
    const result = await callApi(key, payload);
    state.content[field] = result;
    state.done[key] = true;
    if (key === 'image') {
      initImageCards();
    }
    render();
  } catch (e) {
    if (errBox) errBox.textContent = `${friendlyError(e.message)} 입력 내용은 보존되었습니다.`;
  } finally {
    if (statusBox) statusBox.textContent = '';
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = oldText; }
  }
}

function initImageCards() {
  const c = state.content;
  const seedText = (c.productDesc || c.keyword || '').trim();
  if (!c.imagePrompts) {
    c.imagePrompts = Array.from({length: IMAGE_CARD_COUNT}, (_, i) =>
      seedText ? `${seedText} — 장면 ${i+1}` : `장면 ${i+1}에 어울리는 이미지 설명을 적어주세요`);
  }
  if (!c.imageUrls) c.imageUrls = Array(IMAGE_CARD_COUNT).fill(null);
  if (!c.imageLoading) c.imageLoading = Array(IMAGE_CARD_COUNT).fill(false);
  if (!c.imageErrors) c.imageErrors = Array(IMAGE_CARD_COUNT).fill('');
  if (!c.selectedImages) c.selectedImages = Array(IMAGE_CARD_COUNT).fill(false);
}

function updateCardPrompt(i, value) {
  state.content.imagePrompts[i] = value;
}

async function generateCardImage(i) {
  const c = state.content;
  const prompt = (c.imagePrompts[i] || '').trim();
  if (!prompt) { c.imageErrors[i] = '이미지 설명을 먼저 입력하세요.'; render(); return; }
  const nextCount = (state.meta.imageGenerations || 0) + 1;
  if (!confirm(`이미지 1장을 생성합니다. 실제 API 비용이 발생할 수 있습니다.\n이번 작업의 생성 요청: ${nextCount}회\n계속할까요?`)) return;
  c.imageLoading[i] = true;
  c.imageErrors[i] = '';
  render();
  try {
    const url = await callImageApi(prompt);
    c.imageUrls[i] = url + '?t=' + Date.now();
    state.meta.imageGenerations = nextCount;
  } catch (e) {
    c.imageErrors[i] = friendlyError(e.message, true);
  } finally {
    c.imageLoading[i] = false;
    render();
  }
}

function toggleImage(i) {
  state.content.selectedImages[i] = !state.content.selectedImages[i];
  render();
}

function insertImages() {
  state.content.imagesInserted = true;
  render();
}

function panelHTML(s) {
  const c = state.content;
  if (s.n === 1) {
    return `
      <div class="station">STATION 01</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <label class="field" for="kw">키워드 <span style="color:var(--red)">필수</span></label>
      <input id="kw" placeholder="예: 비트코인 시세" value="${esc(c.keyword)}" oninput="updateKeyword(this.value)" />
      <div class="chips-row">${TRENDS.map(t=>`<button type="button" class="trend-chip" onclick="chooseTrend('${t}', this)">🔥 ${t}</button>`).join('')}</div>
      <label class="field">최신 정보 붙여넣기 (선택)</label>
      <textarea placeholder="반영하고 싶은 최신 내용을 붙여넣으세요." oninput="state.content.extraInfo=this.value">${esc(c.extraInfo)}</textarea>
      <div class="row">
        <button id="generate-original" class="btn-primary" onclick="runStep('original','original',{keyword: state.content.keyword||document.getElementById('kw').value, extraInfo: state.content.extraInfo||''}, this)" ${c.keyword ? '' : 'disabled title="키워드를 먼저 입력하세요"'}>✨ 원본 글 생성</button>
        ${state.done.original ? '<span class="stamp">생성 완료</span>' : ''}
      </div>
      <div id="status-original"></div>
      <div class="error" id="err-original"></div>
      ${c.original ? `<textarea id="ta-original" class="output" oninput="state.content.original=this.value">${esc(c.original)}</textarea>
      ${toolbarHTML('original','ta-original', "runStep('original','original',{keyword: state.content.keyword||document.getElementById('kw').value, extraInfo: state.content.extraInfo||''}, this)")}` : ''}
      ${footerHTML(1, !!c.original)}
    `;
  }
  if (s.n === 2) {
    if (!c.original) return emptyPrev('1단계에서 원본 글을 먼저 만들어야 해요.', 1) + footerHTML(2, !!c.naver);
    return `
      <div class="station">STATION 02</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <label class="field">원본 글 (1단계 결과)</label>
      <textarea readonly style="opacity:.75">${esc(c.original)}</textarea>
      <div class="row">
        <button class="btn-primary" onclick="runStep('naver','naver',{original: state.content.original}, this)">✨ 네이버 글로 변환</button>
        ${state.done.naver ? '<span class="stamp">생성 완료</span>' : ''}
      </div>
      <div class="error" id="err-naver"></div>
      ${c.naver ? `<textarea id="ta-naver" class="output" oninput="state.content.naver=this.value">${esc(c.naver)}</textarea>
      ${toolbarHTML('naver','ta-naver', "runStep('naver','naver',{original: state.content.original}, this)")}` : ''}
      ${footerHTML(2, !!c.naver)}
    `;
  }
  if (s.n === 3) {
    if (!c.original) return emptyPrev('1단계 원본 글이 먼저 필요해요.', 1) + footerHTML(3, !!c.thread);
    return `
      <div class="station">STATION 03</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <div class="row">
        <button class="btn-primary" onclick="runStep('thread','thread',{original: state.content.original, naver: state.content.naver||''}, this)">✨ 스레드 글 생성</button>
        ${state.done.thread ? '<span class="stamp">생성 완료</span>' : ''}
      </div>
      <div class="error" id="err-thread"></div>
      ${c.thread ? `<textarea id="ta-thread" oninput="state.content.thread=this.value">${esc(c.thread)}</textarea>
      <div class="row"><button class="btn-ghost" onclick="copyText(state.content.thread, this)">복사</button></div>` : ''}
      ${footerHTML(3, !!c.thread)}
    `;
  }
  if (s.n === 4) {
    if (!c.original) return emptyPrev('1단계 원본 글을 기준으로 장면을 나눕니다.', 1) + footerHTML(4, !!c.shorts);
    return `
      <div class="station">STATION 04</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <div class="row">
        <button class="btn-primary" onclick="runStep('shorts','shorts',{original: state.content.original}, this)">✨ 쇼츠 기획안 생성</button>
        ${state.done.shorts ? '<span class="stamp">생성 완료</span>' : ''}
      </div>
      <div class="error" id="err-shorts"></div>
      ${c.shorts ? `<textarea id="ta-shorts" class="output" oninput="state.content.shorts=this.value">${esc(c.shorts)}</textarea>
      ${toolbarHTML('shorts','ta-shorts', "runStep('shorts','shorts',{original: state.content.original}, this)")}` : ''}
      ${footerHTML(4, !!c.shorts)}
    `;
  }
  if (s.n === 5) {
    return `
      <div class="station">STATION 05</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <div class="cost-box"><strong>비용 안내</strong><br>이미지 생성 버튼을 누를 때마다 Gemini API가 1회 호출됩니다. 생성 직전에 확인창이 표시되며, 이번 작업에서는 지금까지 <strong>${state.meta.imageGenerations || 0}회</strong> 요청했습니다.</div>
      <label class="field">상품/장면 참고 설명 (선택 — 카드별 설명 초안에 반영돼요)</label>
      <input placeholder="예: 스마트폰 화면에 서로 다른 코인 가격이 떠 있는 장면" oninput="state.content.productDesc=this.value" value="${esc(c.productDesc)}" />
      <div class="row">
        <button class="btn-ghost" onclick="runStep('image','images',{shorts: state.content.shorts||'', original: state.content.original||'', productDesc: state.content.productDesc||''}, this)">📝 이미지 프롬프트 아이디어 텍스트로 받기 (무료)</button>
      </div>
      <div class="error" id="err-image"></div>
      ${c.images ? `
      <label class="field">참고용 프롬프트 아이디어</label>
      <textarea id="ta-images" class="output" oninput="state.content.images=this.value">${esc(c.images)}</textarea>
      <div class="row"><button class="btn-ghost" onclick="copyText(state.content.images, this)">복사</button></div>
      ` : ''}

      ${(() => { initImageCards(); return ''; })()}
      <label class="field">이미지 카드 8개 — 설명을 적고 "생성" 버튼을 누른 카드만 실제로 만들어져요</label>
      <div class="grid2">${Array.from({length: IMAGE_CARD_COUNT}).map((_,i)=>{
        const sel = c.selectedImages[i];
        const url = c.imageUrls[i];
        const loading = c.imageLoading[i];
        const err = c.imageErrors[i];
        return `<div class="img-card ${sel?'selected':''}">
          <div class="img-swatch">${url ? `<img src="${esc(url)}" alt="SCENE_${i+1}" />` : `<span class="placeholder-label">${loading ? '생성 중...' : 'SCENE_' + (i+1)}</span>`}</div>
          <div class="img-card-body">SCENE_${i+1}${url ? ' · 생성됨' : ''}</div>
          <textarea class="small" oninput="updateCardPrompt(${i}, this.value)" placeholder="이 장면의 이미지 설명">${esc(c.imagePrompts[i])}</textarea>
          <div class="img-card-actions">
            <button class="btn-ghost small" onclick="generateCardImage(${i})" ${loading?'disabled':''}>${loading ? '⏳ 생성 중...' : (url ? '↻ 다시 생성 (유료)' : '🖼 이 장면 생성 (유료)')}</button>
            ${url ? `<button class="btn-ghost small ${sel?'on':''}" onclick="toggleImage(${i})">${sel?'✓ 사용 중':'선택'}</button>` : ''}
          </div>
          ${err ? `<div class="error" style="margin:6px 10px 0;">${esc(err)}</div>` : ''}
        </div>`;
      }).join('')}</div>

      <div class="row">
        <button class="btn-primary" onclick="insertImages()" ${c.selectedImages.some(Boolean) ? '' : 'disabled'}>🖼 선택한 이미지를 글에 삽입</button>
        ${c.imagesInserted ? '<span class="stamp">삽입됨</span>' : ''}
      </div>
      ${footerHTML(5, c.imageUrls.some(Boolean))}
    `;
  }
  if (s.n === 6) {
    initImageCards();
    const chosen = (c.selectedImages || []).map((v,i)=>v?i+1:null).filter(Boolean);
    return `
      <div class="station">STATION 06</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <label class="field">사용할 이미지 (5단계에서 고른 것)</label>
      <div class="chips-row">${chosen.length ? chosen.map(n=>`<span class="trend-chip" style="border-color:var(--teal);color:var(--teal)">SCENE_${n}</span>`).join('') : '<span class="note">5단계에서 이미지를 만들고 골라주세요.</span>'}</div>

      <label class="field" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" ${c.dubbingOn?'checked':''} onchange="state.content.dubbingOn=this.checked; render()" /> 더빙 넣기</label>
      ${c.dubbingOn ? `
      <label class="field">더빙 목소리</label>
      <select onchange="state.content.voice=this.value">${VOICES.map(v=>`<option ${c.voice===v?'selected':''}>${v}</option>`).join('')}</select>
      <label class="field">말 속도 (${c.speed||1.0}배속, 0.9~1.5 사이)</label>
      <input type="range" min="0.9" max="1.5" step="0.1" value="${c.speed||1.0}" oninput="state.content.speed=this.value; render()" />
      ` : ''}

      <label class="field">배경음악 (선택)</label>
      <input type="file" onchange="state.content.bgMusicName=this.files[0]?this.files[0].name:''; render()" />
      ${c.bgMusicName ? `<div class="note">선택된 파일: ${esc(c.bgMusicName)}</div>` : ''}

      <div class="row">
        <button class="btn-primary" onclick="state.done.video=true; state.content.videoBuilt=true; render()" ${chosen.length ? '' : 'disabled'}>✨ 숏폼 영상 초안 만들기</button>
        ${c.videoBuilt ? `<button class="btn-ghost" onclick="render()">↻ 다시 구성</button>` : ''}
        ${state.done.video ? '<span class="stamp">구성 완료</span>' : ''}
      </div>
      ${!chosen.length ? '<div class="note">5단계에서 이미지를 만들고 골라야 장면을 이어 붙일 수 있어요.</div>' : ''}

      ${c.videoBuilt ? `
      <div class="row" style="border:1px solid var(--line); border-radius:10px; padding:14px; display:block;">
        <div class="station">VIDEO DRAFT</div>
        <div style="font-size:13px; color:var(--muted); margin-top:6px;">장면 ${chosen.length}컷 · 더빙: ${c.dubbingOn ? (c.voice||VOICES[0]) + ' · ' + (c.speed||1.0) + '배속' : '더빙 없음'} · 세로 9:16</div>
        <div class="note">실제 렌더링은 기존 릴스 생성 파이프라인(ffmpeg)과 연결해야 파일로 나옵니다.</div>
      </div>` : ''}
      ${footerHTML(6, !!c.videoBuilt)}
    `;
  }
  if (s.n === 7) {
    const allText = [c.original,c.naver,c.thread,c.shorts,c.images].filter(Boolean).join('\n\n---\n\n');
    return `
      <div class="station">STATION 07</div>
      <div class="panel-title">${s.label}</div>
      <div class="panel-desc">${s.desc}</div>
      <div class="check-list">${STEPS.slice(0,6).map(st=>`<div class="check-item ${state.done[st.key]?'on':'off'}">${state.done[st.key]?'✓':'·'} ${st.label} ${state.done[st.key]?'완료':'미완료'}</div>`).join('')}</div>
      <div class="row">
        <button class="btn-primary" onclick="state.done.publish=true; state.content.published=new Date().toLocaleString('ko-KR'); render()">🏷 발행 완료 도장 찍기</button>
        ${c.published ? `<span class="stamp">발행됨 · ${c.published}</span>` : ''}
      </div>
      ${allText ? `<label class="field">전체 결과물 모아보기</label><textarea class="output" id="all-text-box" readonly>${esc(allText)}</textarea>
      <div class="row"><button class="btn-ghost" onclick="copyText(document.getElementById('all-text-box').value, this)">복사</button></div>` : ''}
      <div class="nav-footer"><button class="btn-ghost" onclick="goTo(6)">이전 단계</button><span></span></div>
    `;
  }
}

function emptyPrev(text, gotoN) {
  return `<div class="note">${text} <span style="color:var(--amber); cursor:pointer" onclick="goTo(${gotoN})">이전 단계로 이동 →</span></div>`;
}

function footerHTML(n, nextEnabled) {
  return `<div class="nav-footer">
    <button class="btn-ghost" onclick="goTo(${Math.max(1,n-1)})" ${n===1?'disabled':''}>이전 단계</button>
    <button class="btn-primary" onclick="goTo(${n+1})" ${nextEnabled?'':'disabled title="현재 단계의 결과를 먼저 생성하세요"'}>다음 단계 →</button>
  </div>`;
}

function updateKeyword(value) {
  state.content.keyword = value;
  const btn = document.getElementById('generate-original');
  if (btn) {
    btn.disabled = !value.trim();
    btn.title = value.trim() ? '' : '키워드를 먼저 입력하세요';
  }
  persistState();
}

function chooseTrend(value, btn) {
  const input = document.getElementById('kw');
  if (input) input.value = value;
  updateKeyword(value);
  document.querySelectorAll('.trend-chip').forEach(el => el.classList.remove('on'));
  if (btn) btn.classList.add('on');
}

function render() {
  renderStepper();
  const wrap = document.getElementById('panels');
  const s = STEPS.find(s => s.n === state.active);
  wrap.innerHTML = `<div class="panel show">${panelHTML(s)}</div>`;
  persistState();
}

render();
</script>
</div>
