services:
  - type: web
    name: ai-blog-factory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_TEXT_MODEL
        value: gpt-4.1-mini
      - key: BLOGGER_BLOG_ID
        sync: false
      - key: BLOGGER_ACCESS_TOKEN
        sync: false
